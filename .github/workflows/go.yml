name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Start stack
      run: make up

    - name: Wait for proxy
      run: |
        for _ in $(seq 1 60); do
          curl -sf http://127.0.0.1:9090/readyz && exit 0
          sleep 1
        done
        exit 1

    - name: E2E tests
      run: go test -v -tags e2e -count=1 ./test/e2e/...

    - name: Stack logs
      if: failure()
      run: docker compose -f deployments/docker-compose.yaml logs

    - name: Stop stack
      if: always()
      run: make down
